
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ed">
  <meta name="description" content="≠ME『名無しのシンデレラ』候補者情報を整理する非公式ファンサイトです。">
  <title>名無しのシンデレラ｜候補者データベース</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="トップページ">
        <span class="brand-kicker">≠ME FAN DATABASE</span>
        <span class="brand-title">名無しのシンデレラ</span>
      </a>
      <span class="unofficial-label">非公式ファンサイト</span>
    </div>
  </header>

  <main class="page-shell">
    <section class="intro" aria-label="サイトについて">
      <p>『名無しのシンデレラ』候補者の公開情報を整理するファン制作のデータベースです。</p>
      <p class="notice">※公式運営とは無関係です。掲載情報・画像の権利は各権利者に帰属します。</p>
    </section>

    <section id="list-view" aria-labelledby="list-heading">



<div class="list-toolbar">
  <div>
    <p class="eyebrow">CANDIDATES</p>
    <h1 id="list-heading">候補者一覧</h1>
  </div>
</div>

<div class="compact-controls">

  <div class="control-buttons">

    <!-- 並び替え -->
    <div class="control-menu-wrap">
      <button
        id="sort-menu-button"
        class="control-main-button"
        type="button"
        aria-expanded="false"
        aria-controls="sort-menu"
      >
        <span class="control-icon">↕</span>
        <span>並び替え</span>
        <span class="control-chevron"></span>
      </button>

      <div id="sort-menu" class="control-dropdown" hidden>
        <button type="button" data-sort-value="team" class="is-selected">
          チーム別
        </button>
        <button type="button" data-sort-value="name">
          名前順
        </button>
        <button type="button" data-sort-value="age">
          年齢順（若い順）
        </button>
        <button type="button" data-sort-value="height">
          身長順（低い順）
        </button>
      </div>
    </div>

    <!-- 絞り込み -->
    <button
      id="profile-filter-button"
      class="control-main-button"
      type="button"
      aria-expanded="false"
      aria-controls="profile-filter-panel"
    >
      <span class="control-icon">☷</span>
      <span>絞り込み</span>
      <span id="profile-filter-dot" class="control-active-dot" hidden></span>
    </button>

    <!-- お気に入り・自己評価 -->
    <div class="control-menu-wrap">
      <button
        id="favorite-menu-button"
        class="control-main-button"
        type="button"
        aria-expanded="false"
        aria-controls="favorite-menu"
      >
        <span class="control-icon">☆</span>
        <span>お気に入り</span>
        <span class="control-chevron"></span>
      </button>

      <div id="favorite-menu" class="control-dropdown control-dropdown-right" hidden>
        <button type="button" data-favorite-value="all" class="is-selected">
          すべて
        </button>
        <button type="button" data-favorite-value="favorite">
          ★ お気に入り
        </button>
        <button type="button" data-favorite-value="overall">
          ♡ 総合
        </button>
        <button type="button" data-favorite-value="singing">
          ♡ 歌唱
        </button>
        <button type="button" data-favorite-value="performance">
          ♡ パフォーマンス
        </button>
      </div>
    </div>

  </div>

  <!-- 既存JSとの連携用 -->
  <div class="control-native-values" hidden>
    <select id="sort-select">
      <option value="team">チーム別</option>
      <option value="name">名前順</option>
      <option value="age">年齢順</option>
      <option value="height">身長順</option>
    </select>

    <select id="filter-select">     
      <option value="all">すべて</option>
      <option value="favorite">お気に入り</option>
      <option value="singing">歌唱 ♡</option>
      <option value="performance">パフォーマンス ♡</option>
      <option value="visual">ビジュアル ♡</option>
      <option value="personality">愛嬌・性格 ♡</option>
    </select>
  </div>

  <!-- 絞り込みの展開パネル -->
  <div id="profile-filter-panel" class="compact-filter-panel" hidden>

    <div class="compact-filter-row">
      <label for="origin-filter">出身地</label>
      <select id="origin-filter">
        <option value="all">すべて</option>
      </select>
    </div>

    <div class="compact-filter-row age-filter-row">
      <div class="age-filter-heading">
        <span>年齢</span>
        <span id="age-range-label">すべて</span>
      </div>

      <div id="age-range-control" class="age-range-control">
        <div class="age-range-track"></div>
        <div id="age-range-fill" class="age-range-fill"></div>

        <input
          id="age-min"
          class="age-range-input age-range-min"
          type="range"
          min="14"
          max="27"
          value="14"
          aria-label="最低年齢"
        >

        <input
          id="age-max"
          class="age-range-input age-range-max"
          type="range"
          min="14"
          max="27"
          value="27"
          aria-label="最高年齢"
        >
      </div>

      <div class="age-range-ends">
        <span id="age-range-start">0歳</span>
        <span id="age-range-end">100歳</span>
      </div>
    </div>

    <button id="profile-filter-reset" class="filter-reset-button" type="button">
      条件をクリア
    </button>
  </div>

</div>

<!-- ≠MEメンバー表示：従来どおり独立配置 -->
<label
  id="members-toggle-wrap"
  class="members-toggle"
  hidden
>
  <input
    type="checkbox"
    id="show-members"
    checked
  >
  <span>≠MEメンバーを表示</span>
</label>




      <p id="list-status" class="status-line" aria-live="polite"></p>

      <div id="candidate-grid" class="candidate-grid"></div>

      <div id="empty-state" class="empty-state" hidden>
        <span class="empty-mark">✳</span>
        <h2>表示する候補者がいません</h2>
        <p>絞り込み条件を変更するか、データを確認してください。</p>
      </div>
    </section>

    <section id="detail-view" class="detail-view" hidden aria-live="polite">
      <button id="back-button" class="back-button" type="button">
        ← 候補者一覧に戻る
      </button>
      <div id="detail-content"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>UNOFFICIAL FAN-MADE DATABASE</p>
    <p>公開情報をもとに作成した非公式サイトです。</p>
  </footer>
</body>
</html>
